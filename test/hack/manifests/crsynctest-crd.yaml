# Simple CRD for local development and testing of the crsync controller.
# Applied to all kind clusters by setup-local-dev-clusters.sh.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: crsynctests.crsync.test.io
spec:
  group: crsync.test.io
  names:
    kind: CRSyncTest
    listKind: CRSyncTestList
    plural: crsynctests
    singular: crsynctest
    shortNames:
      - cst
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                message:
                  type: string
                  description: A test message to sync across clusters.
                replicas:
                  type: integer
                  description: A numeric field for testing.
                enabled:
                  type: boolean
                  description: A boolean field for testing.
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: Current phase of the resource.
                observedGeneration:
                  type: integer
                  format: int64
                  description: The generation last observed by the controller.
                conditions:
                  type: array
                  description: Conditions in the metav1.Condition shape, keyed by type.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Message
          type: string
          jsonPath: .spec.message
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
