image:
  registry: r0bnet/crsync
  tag: latest
  pullPolicy: IfNotPresent

replicas: 1

leaderElection:
  enabled: true

metrics:
  bindAddress: ":8080"

probes:
  bindAddress: ":8081"

clusterProfile:
  # accessProvider: exec plugin that turns a ClusterProfile's accessProviders entry into credentials.
  # Mounted as an image volume. v0.1.3, not v0.1.2: the v0.1.2 arm64 image ships an amd64 binary.
  accessProvider:
    name: kubeconfig-secretreader
    image: registry.k8s.io/cluster-inventory-api/kubeconfig-secretreader:v0.1.3
    pullPolicy: IfNotPresent

eventReplay:
  # enabled: replay hub Events onto the source objects in workload clusters, following
  # ownerReferences from composed resources. Off by default: walking owners needs read access.
  enabled: false

# ownerResources: types crsync may read while walking ownerReferences (event replay and write-back).
# Empty grants get on all resources (*/*). Only used when either feature is on.
ownerResources: []
#  - group: "kubernetes.m.crossplane.io"
#    resources: ["objects"]

concurrency:
  # hub: max concurrent reconciles for hub-side controllers (status sync and write-back from hub to spokes).
  hub: 1
  # spoke: max concurrent reconciles for spoke-side controllers (resource sync from spoke clusters to hub).
  spoke: 1

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

config:
  # resources: list of GVKs to sync. Each entry needs group, kind, and resource (plural API name).
  # version is optional; when empty, all versions are discovered from the API server.
  # resource is required for RBAC rule generation (the plural lowercase API resource name).
  resources: []
  #  - group: "crsync.test.io"
  #    version: "v1alpha1"
  #    kind: "CRSyncTest"
  #    resource: "crsynctests"
  # writeBack: hub GVKs copied back to the workload cluster when they belong to a hub copy,
  # by controller ownerReferences or the crsync.r0bnet.github.io/write-back: "true" annotation.
  # Same format as resources. Empty disables write-back.
  writeBack: []
  #  - group: ""
  #    version: "v1"
  #    kind: "Secret"
  #    resource: "secrets"
  # writeBackCopyLabel: label key marking crsync's copies on workload clusters. Empty uses
  # crsync.r0bnet.github.io/write-back-copy. Changing it orphans existing copies.
  writeBackCopyLabel: ""

serviceAccount:
  name: crsync-controller-manager
  annotations: {}

