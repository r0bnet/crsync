apiVersion: apps/v1
kind: Deployment
metadata:
  name: crsync-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crsync.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "crsync.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "crsync.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      terminationGracePeriodSeconds: 10
      containers:
      - name: manager
        image: "{{ .Values.image.registry }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - --config=/etc/crsync/config.yaml
        {{- if .Values.leaderElection.enabled }}
        - --leader-elect
        {{- end }}
        - --metrics-bind-address={{ .Values.metrics.bindAddress }}
        - --health-probe-bind-address={{ .Values.probes.bindAddress }}
        - --clusterprofile-provider-file=/etc/crsync/clusterprofile-provider.json
        - --hub-max-concurrent-reconciles={{ .Values.concurrency.hub }}
        - --spoke-max-concurrent-reconciles={{ .Values.concurrency.spoke }}
        {{- if .Values.eventReplay.enabled }}
        - --replay-events
        {{- end }}
        securityContext:
          {{- toYaml .Values.containerSecurityContext | nindent 10 }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/crsync
          readOnly: true
        - name: access-plugin
          mountPath: /plugin
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: crsync-controller-manager
      - name: access-plugin
        image:
          reference: {{ .Values.clusterProfile.accessProvider.image }}
          pullPolicy: {{ .Values.clusterProfile.accessProvider.pullPolicy }}
