{{/* Leader election Role (namespace-scoped) */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crsync-leader-election-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crsync.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
{{/* Leader election RoleBinding */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crsync-leader-election-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crsync.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crsync-leader-election-role
subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
---
{{/* Manager ClusterRole — static rules + dynamic rules from configured GVKs */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crsync-manager-role
  labels:
    {{- include "crsync.labels" . | nindent 4 }}
rules:
{{/* --- Static rules (always needed) --- */}}
{{/* Namespace provisioner: creates hub namespaces on demand, deletes on cluster disengage */}}
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - delete
{{/* Access plugin reads the kubeconfig Secrets of ClusterProfiles */}}
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
{{/* Event controller watches events.k8s.io/v1 Events on the hub; the spoke reconciler records FieldConflict events */}}
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - get
  - list
  - watch
  - create
  - patch
{{/* Core events: for recording controller events */}}
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
{{/* ClusterProfile provider: watches the cluster inventory */}}
- apiGroups:
  - multicluster.x-k8s.io
  resources:
  - clusterprofiles
  verbs:
  - get
  - list
  - watch
{{/* Event replay and write-back walk ownerReferences; synced GVKs are readable via the rules below */}}
{{- if or .Values.eventReplay.enabled .Values.config.writeBack }}
{{- if .Values.ownerResources }}
{{- range .Values.ownerResources }}
- apiGroups:
  - {{ .group | quote }}
  resources:
  {{- range .resources }}
  - {{ . | quote }}
  {{- end }}
  verbs:
  - get
{{- end }}
{{- else }}
- apiGroups:
  - "*"
  resources:
  - "*"
  verbs:
  - get
{{- end }}
{{- end }}
{{/* Write-back: watches hub objects of the configured GVKs */}}
{{- range .Values.config.writeBack }}
- apiGroups:
  - {{ .group | quote }}
  resources:
  - {{ .resource | quote }}
  verbs:
  - get
  - list
  - watch
{{- end }}
{{/* --- Dynamic rules from configured GVKs --- */}}
{{- range .Values.config.resources }}
- apiGroups:
  - {{ .group | quote }}
  resources:
  - {{ .resource | quote }}
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - {{ .group | quote }}
  resources:
  - {{ printf "%s/status" .resource | quote }}
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - {{ .group | quote }}
  resources:
  - {{ printf "%s/finalizers" .resource | quote }}
  verbs:
  - update
{{- end }}
---
{{/* Manager ClusterRoleBinding */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crsync-manager-rolebinding
  labels:
    {{- include "crsync.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crsync-manager-role
subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
